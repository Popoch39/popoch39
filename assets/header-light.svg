<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Louis Pocheron — Geospatial Software Engineer">
  <style>
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .mono  { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    .contour {
      fill: none;
      stroke: #0f766e;
      vector-effect: non-scaling-stroke;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: draw 2.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .c0 { stroke-width: 1.6; stroke-opacity: 0.9;  animation-delay: 0s;   }
    .c1 { stroke-width: 1;   stroke-opacity: 0.55; animation-delay: .15s; }
    .c2 { stroke-width: 1;   stroke-opacity: 0.45; animation-delay: .3s;  }
    .c3 { stroke-width: 1.6; stroke-opacity: 0.75; animation-delay: .45s; }
    .c4 { stroke-width: 1;   stroke-opacity: 0.4;  animation-delay: .6s;  }
    .c5 { stroke-width: 1;   stroke-opacity: 0.35; animation-delay: .75s; }
    .c6 { stroke-width: 1;   stroke-opacity: 0.3;  animation-delay: .9s;  }
    .fade { opacity: 0; animation: fadein 1s ease-out forwards; }
    .f1 { animation-delay: .2s; }
    .f2 { animation-delay: .5s; }
    .f3 { animation-delay: .8s; }
    .f4 { animation-delay: 1.2s; }
    .pulse {
      transform-origin: 740px 128px;
      animation: pulse 3s ease-out 1.6s infinite;
      opacity: 0;
    }
    @keyframes draw   { to { stroke-dashoffset: 0; } }
    @keyframes fadein { to { opacity: 1; } }
    @keyframes pulse {
      0%   { opacity: .7; transform: scale(.3); }
      70%  { opacity: 0;  transform: scale(1.4); }
      100% { opacity: 0;  transform: scale(1.4); }
    }
    @media (prefers-reduced-motion: reduce) {
      .contour { animation: none; stroke-dashoffset: 0; }
      .fade    { animation: none; opacity: 1; }
      .pulse   { animation: none; opacity: 0; }
    }
  </style>

  <!-- background -->
  <rect width="1000" height="260" fill="#ffffff"/>

  <!-- faint tile grid -->
  <g stroke="#eff2f5" stroke-width="1">
    <path d="M76 0V260 M152 0V260 M228 0V260 M304 0V260 M380 0V260 M456 0V260 M532 0V260 M608 0V260 M684 0V260 M760 0V260 M836 0V260 M912 0V260"/>
    <path d="M0 65H1000 M0 130H1000 M0 195H1000"/>
  </g>

  <!-- map sheet frame -->
  <rect x="14.5" y="14.5" width="971" height="231" fill="none" stroke="#d0d7de" stroke-width="1"/>
  <!-- graticule ticks -->
  <g stroke="#8c959f" stroke-width="1">
    <path d="M255 14.5v7 M500 14.5v7 M745 14.5v7"/>
    <path d="M255 245.5v-7 M500 245.5v-7 M745 245.5v-7"/>
    <path d="M14.5 130h7 M985.5 130h-7"/>
  </g>
  <!-- corner coordinates -->
  <g class="mono fade f1" font-size="10" fill="#57606a" letter-spacing="1">
    <text x="24" y="34">47.2378° N</text>
    <text x="976" y="34" text-anchor="end">6.0241° E</text>
  </g>

  <!-- contour hill (right side), clipped to the map neatline -->
  <clipPath id="sheet"><rect x="15" y="15" width="970" height="230"/></clipPath>
  <g class="fade" opacity="0" clip-path="url(#sheet)">
    <g transform="translate(740 128)">
      <path class="contour c6" pathLength="1" d="M215.8 8.0C215.2 36.4 202.3 71.4 175.4 92.4C148.4 113.4 96.8 126.5 54.2 134.2C11.5 141.9 -34.6 144.0 -80.5 138.6C-126.3 133.2 -191.7 123.8 -220.7 102.0C-249.6 80.2 -261.9 35.9 -254.2 8.0C-246.4 -19.9 -203.5 -43.6 -174.4 -65.2C-145.3 -86.7 -119.5 -108.7 -79.6 -121.0C-39.7 -133.4 22.0 -146.3 65.1 -139.1C108.2 -131.9 153.7 -102.5 178.9 -78.0C204.0 -53.5 216.4 -20.4 215.8 8.0Z"/>
      <path class="contour c5" pathLength="1" d="M199.4 -6.0C206.6 17.1 205.0 54.8 182.5 73.1C160.0 91.3 102.9 99.1 64.4 103.5C25.9 108.0 -11.8 106.0 -48.6 100.0C-85.3 94.0 -134.3 85.2 -156.1 67.5C-178.0 49.8 -182.3 17.3 -179.8 -6.0C-177.2 -29.3 -160.9 -51.7 -140.7 -72.6C-120.6 -93.5 -93.5 -123.1 -58.7 -131.4C-23.9 -139.7 35.0 -133.4 68.0 -122.5C101.1 -111.5 117.6 -85.1 139.5 -65.7C161.4 -46.3 192.3 -29.1 199.4 -6.0Z"/>
      <path class="contour c4" pathLength="1" d="M137.7 7.0C135.8 26.1 131.9 46.1 116.2 61.6C100.6 77.2 72.2 93.8 43.9 100.3C15.5 106.7 -23.3 105.6 -53.8 100.2C-84.3 94.7 -120.8 82.9 -139.1 67.4C-157.5 51.9 -167.6 25.5 -163.9 7.0C-160.1 -11.5 -135.4 -28.6 -116.7 -43.3C-97.9 -58.0 -78.8 -72.2 -51.2 -81.1C-23.5 -89.9 19.4 -101.1 49.2 -96.4C79.0 -91.7 112.8 -70.0 127.6 -52.7C142.4 -35.5 139.6 -12.1 137.7 7.0Z"/>
      <path class="contour c3" pathLength="1" d="M127.1 -4.0C126.2 11.2 117.9 29.0 103.4 40.3C89.0 51.7 63.0 59.9 40.6 63.9C18.2 68.0 -7.1 67.8 -30.9 64.6C-54.8 61.3 -86.6 55.9 -102.5 44.4C-118.4 33.0 -129.4 10.8 -126.5 -4.0C-123.6 -18.8 -101.1 -33.5 -84.9 -44.5C-68.8 -55.5 -51.3 -64.3 -29.7 -70.2C-8.1 -76.1 21.7 -83.1 44.7 -79.8C67.8 -76.6 95.0 -63.4 108.7 -50.7C122.4 -38.1 128.0 -19.2 127.1 -4.0Z"/>
      <path class="contour c2" pathLength="1" d="M94.6 3.0C97.6 13.6 88.0 30.9 75.7 38.9C63.5 46.9 38.6 48.7 21.1 50.8C3.5 52.9 -13.3 54.1 -29.4 51.6C-45.6 49.0 -65.5 43.4 -75.7 35.3C-85.9 27.2 -89.9 14.1 -90.6 3.0C-91.3 -8.1 -89.5 -21.8 -80.0 -31.2C-70.5 -40.7 -50.3 -51.6 -33.6 -53.6C-17.0 -55.5 4.8 -47.6 20.0 -42.9C35.3 -38.1 45.5 -32.5 57.9 -24.9C70.4 -17.3 91.6 -7.6 94.6 3.0Z"/>
      <path class="contour c1" pathLength="1" d="M63.3 2.0C64.2 8.7 56.9 18.1 49.4 23.4C41.9 28.6 29.3 31.7 18.6 33.6C7.8 35.5 -5.1 36.8 -15.2 34.9C-25.3 32.9 -36.0 27.4 -42.1 21.9C-48.2 16.4 -51.0 9.0 -51.9 2.0C-52.7 -5.0 -53.0 -14.3 -47.1 -20.1C-41.2 -26.0 -27.2 -32.0 -16.5 -33.2C-5.7 -34.4 7.3 -30.1 17.4 -27.4C27.5 -24.6 36.5 -21.9 44.1 -17.0C51.8 -12.1 62.4 -4.7 63.3 2.0Z"/>
      <path class="contour c0" pathLength="1" d="M31.0 0.0C31.2 3.5 27.4 7.8 23.7 10.7C20.1 13.6 14.8 15.9 9.1 17.4C3.4 18.8 -4.7 20.6 -10.2 19.5C-15.8 18.5 -21.7 14.2 -24.2 10.9C-26.8 7.7 -25.5 3.7 -25.6 0.0C-25.7 -3.7 -27.3 -7.8 -24.8 -11.2C-22.3 -14.5 -16.1 -19.0 -10.5 -20.0C-4.9 -21.0 3.4 -18.7 9.0 -17.1C14.5 -15.5 19.0 -13.0 22.6 -10.2C26.3 -7.3 30.8 -3.5 31.0 0.0Z"/>
    </g>
    <!-- index-contour elevation label -->
    <g class="mono fade f3" font-size="10" fill="#0f766e" opacity="0">
      <rect x="806" y="171" width="38" height="14" fill="#ffffff"/>
      <text x="825" y="182" text-anchor="middle" letter-spacing="1">330</text>
    </g>
  </g>

  <!-- summit marker -->
  <circle class="pulse" cx="740" cy="128" r="22" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <g class="fade f4">
    <circle cx="740" cy="128" r="7" fill="none" stroke="#b45309" stroke-width="1.5"/>
    <circle cx="740" cy="128" r="2.5" fill="#b45309"/>
  </g>

  <!-- text block -->
  <g>
    <text class="mono fade f1" x="60" y="86" font-size="12" fill="#b45309" letter-spacing="3">◉ BESANÇON, FRANCE</text>
    <text class="serif fade f2" x="58" y="136" font-size="46" fill="#1f2328" letter-spacing="1">Louis Pocheron</text>
    <text class="mono fade f3" x="60" y="168" font-size="14" fill="#0f766e" letter-spacing="4">GEOSPATIAL SOFTWARE ENGINEER</text>
    <text class="mono fade f4" x="60" y="196" font-size="12" fill="#57606a" letter-spacing="1">maps · tiles · pointclouds — @ DaVikingCode</text>
  </g>

  <!-- scale bar -->
  <g class="fade f4">
    <g stroke="#57606a" stroke-width="1">
      <path d="M60 222h120 M60 218v8 M120 218v8 M180 218v8"/>
    </g>
    <rect x="60" y="220" width="30" height="4" fill="#57606a"/>
    <rect x="120" y="220" width="30" height="4" fill="#57606a"/>
    <text class="mono" x="188" y="226" font-size="9" fill="#57606a">1:25 000</text>
  </g>
</svg>
